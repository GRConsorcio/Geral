<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Oswald:wght@500;600;700&display=swap');
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dark:#8B6914;--gold-hot:#D9B65E;
  --bk:#060B12;--bk2:#0A1420;--bk3:#071019;
  --wh:#F5F0E8;--wh2:#F5F0E8;--bd:rgba(201,168,76,0.25);
  --col-sem:rgba(10,20,32,0.45);
  --col-tot:rgba(10,20,32,0.65);
  --num-font:'Oswald',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bk);overflow:hidden;}
.root{background:var(--bk);font-family:'Montserrat',sans-serif;color:var(--wh);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* HEADER */
.hdr{background:var(--bk2);border-bottom:1px solid var(--bd);padding:.7rem 1rem .5rem;text-align:center;position:relative;flex-shrink:0;}
.hdr::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.logo-img{height:48px;width:auto;object-fit:contain;display:block;margin:0 auto 2px;}
.logo-sub{font-size:8px;letter-spacing:5px;color:var(--wh2);text-transform:uppercase;font-weight:300;}
.month-badge{display:inline-block;margin-top:4px;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--wh);border:0.5px solid var(--bd);padding:2px 10px;border-radius:20px;}

/* PANEL */
.panel{display:none;}.panel.active{display:flex;flex-direction:column;flex:1;min-height:0;}

/* MAIN LAYOUT */
.ranking-layout{display:flex;flex:1;min-height:0;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:70px;flex-shrink:0;background:var(--bk2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;overflow:hidden;}
.metric-card{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;border-bottom:0.5px solid var(--bd);text-align:center;}
.metric-card:last-child{border-bottom:none;}
.metric-lbl{font-size:6px;letter-spacing:1px;text-transform:uppercase;color:var(--wh2);font-weight:400;line-height:1.4;margin-bottom:3px;}
.metric-val{font-family:var(--num-font);font-size:22px;font-weight:600;color:var(--wh);line-height:1;letter-spacing:.5px;}
.metric-val.small{font-size:14px;}
.meta-bar-bg{width:calc(100% - 12px);height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;margin-top:4px;}
.meta-bar-fg{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dark),var(--gold));transition:width .8s ease;}
.meta-pct-lbl{font-size:7px;color:var(--wh);margin-top:2px;letter-spacing:1px;font-weight:600;}
.sidebar-div{width:40px;height:0.5px;background:var(--bd);}
.conn-col{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.5s infinite;}
.live-lbl{font-size:6px;letter-spacing:1px;color:var(--wh2);text-transform:uppercase;}
.cs{display:flex;align-items:center;gap:3px;font-size:6px;letter-spacing:1px;color:var(--wh2);}
.cs-dot{width:6px;height:6px;border-radius:50%;background:#555;flex-shrink:0;}
.cs-dot.ok{background:#5DCAA5;}.cs-dot.err{background:#F0997B;}.cs-dot.wait{background:#C9A84C;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* RIGHT CONTENT */
.right-content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}

/* TABLE — grade dinâmica via JS */
.tbl-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER DA TABELA */
.tbl-head-row{display:grid;flex-shrink:0;border-bottom:1px solid var(--bd);background:var(--bk2);}
.th-pos{background:var(--bk2);display:flex;align-items:center;justify-content:center;padding:6px 2px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--wh);font-weight:700;}
.th-name{background:var(--bk2);display:flex;align-items:center;padding:6px 8px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--wh);font-weight:700;}
.th-sem{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--wh);font-weight:700;background:var(--col-sem);border-left:1px solid var(--bd);cursor:pointer;user-select:none;transition:background .2s;}
.th-sem:hover{background:rgba(201,168,76,0.25);}
.th-sem.active-col{background:rgba(201,168,76,0.30);color:var(--wh);}
.th-tot{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px;font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--wh);font-weight:700;background:var(--col-tot);border-left:2px solid var(--gold-dark);}

/* LINHAS */
.tbl-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.tbl-row{display:grid;flex:1;min-height:0;border-bottom:0.5px solid rgba(201,168,76,0.08);align-items:stretch;}
.tbl-row.r1{background:rgba(201,168,76,0.08);border-left:2px solid var(--gold-hot);}
.tbl-row.r2{background:rgba(180,180,180,0.03);border-left:2px solid transparent;}
.tbl-row.r3{background:rgba(180,100,50,0.03);border-left:2px solid transparent;}
.tbl-row:last-child{border-bottom:none;}

.cell-pos{font-family:var(--num-font);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--wh2);}
.r1 .cell-pos{color:var(--wh);font-size:17px;}
.r2 .cell-pos{color:#C0C0C0;}
.r3 .cell-pos{color:#CD7F32;}

.cell-name{display:flex;flex-direction:column;justify-content:center;padding:4px 6px;overflow:hidden;}
.tname{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--wh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r1 .tname{color:var(--wh);}
.tmeta{font-size:7px;color:var(--wh2);opacity:.5;letter-spacing:.5px;margin-top:1px;}
.barmini{height:2px;background:rgba(255,255,255,0.07);border-radius:1px;margin-top:2px;overflow:hidden;}
.barfill{height:100%;border-radius:1px;background:var(--gold);transition:width .5s ease;}
.r2 .barfill{background:#C0C0C0;}.r3 .barfill{background:#CD7F32;}

.cell-sem{font-family:var(--num-font);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--col-sem);border-left:1px solid var(--bd);font-size:16px;font-weight:600;color:var(--wh2);transition:background .2s;position:relative;}
.cell-sem.active-col{background:rgba(201,168,76,0.28);color:var(--wh);}
.cell-sem .acum{font-size:7px;color:var(--wh);opacity:.6;font-weight:400;margin-top:1px;letter-spacing:.5px;}
/* Valor da semana colapsada — 3x maior que antes (era 9px fixo) */
.sem-val{font-size:16px;}
/* Equipes manuais: célula fica com contorno tracejado ao passar o mouse,
   indicando que dá pra clicar e editar o valor ali mesmo. */
.cell-sem.editable{cursor:pointer;}
.cell-sem.editable:hover{outline:1px dashed var(--gold);outline-offset:-2px;background:rgba(201,168,76,0.1);}
.cell-name{position:relative;}
.cell-name:hover .row-del-btn{opacity:1;pointer-events:all;}
.row-del-btn{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;background:rgba(200,80,80,0.25);color:#e08888;font-size:9px;border-radius:3px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .15s;display:flex;align-items:center;justify-content:center;padding:0;}
.row-del-btn:hover{background:rgba(200,80,80,0.5);}

.cell-tot{font-family:var(--num-font);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--col-tot);border-left:2px solid var(--gold-dark);font-size:19px;font-weight:700;color:var(--wh);}
.cell-tot .pct{font-size:7px;color:var(--wh);opacity:.6;font-weight:400;margin-top:1px;}

/* TOTAL ROW */
.tbl-total{display:grid;flex-shrink:0;border-top:1px solid var(--bd);background:var(--bk2);}
.tot-label{display:flex;align-items:center;padding:6px 8px;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--wh);font-weight:700;}
.tot-sem-val{font-family:var(--num-font);display:flex;align-items:center;justify-content:center;background:var(--col-sem);border-left:1px solid var(--bd);font-size:15px;font-weight:600;color:var(--wh);}
.tot-tot-val{font-family:var(--num-font);display:flex;align-items:center;justify-content:center;background:var(--col-tot);border-left:2px solid var(--gold-dark);font-size:17px;font-weight:700;color:var(--wh);}

.m-input{padding:5px 8px;font-size:14px;border-radius:5px;border:0.5px solid var(--bd);background:var(--bk3);color:var(--wh);text-align:center;font-family:'Montserrat',sans-serif;width:100%;}
.btn-gold{width:100%;margin-top:10px;padding:10px;font-size:13px;letter-spacing:2px;text-transform:uppercase;border-radius:6px;border:none;background:var(--gold);color:#0A0A0A;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:700;}
.save-status{text-align:center;font-size:10px;color:#5DCAA5;margin-top:6px;min-height:16px;letter-spacing:1px;}

/* MONTH EDIT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:var(--bk2);border:1px solid var(--bd);border-radius:12px;padding:1.2rem;width:280px;max-width:90vw;}
.modal-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--wh);margin-bottom:10px;}
.modal-input{width:100%;padding:8px 10px;font-size:14px;border-radius:6px;border:0.5px solid var(--bd);background:var(--bk3);color:var(--wh);font-family:'Montserrat',sans-serif;margin-bottom:10px;}
.modal-row{display:flex;gap:8px;}
.btn-sm{flex:1;padding:7px;font-size:11px;letter-spacing:1px;text-transform:uppercase;border-radius:5px;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:700;}
.btn-cancel{background:var(--bk3);color:var(--wh2);}
.btn-ok{background:var(--gold);color:#0A0A0A;}

/* WEEK COUNT CONTROL */
.week-ctrl{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bk2);border-top:0.5px solid var(--bd);flex-shrink:0;}
.week-ctrl-lbl{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--wh2);flex:1;}
.week-btn{width:22px;height:22px;border-radius:50%;border:0.5px solid var(--bd);background:var(--bk3);color:var(--wh);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;line-height:1;}
.week-btn:hover{background:rgba(201,168,76,0.2);}
.week-num{font-size:14px;font-weight:700;color:var(--wh);min-width:18px;text-align:center;}

/* RESPONSIVO CELULAR */
@media(max-width:480px){
  .sidebar{width:62px;}
  .metric-val{font-size:18px;}
  .metric-val.small{font-size:12px;}
  .tname{font-size:10px;}
  .cell-sem{font-size:13px;}
  .cell-tot{font-size:15px;}
  .cell-pos{font-size:11px;}
  .r1 .cell-pos{font-size:13px;}
  .logo-img{height:38px;}
  .sem-val{font-size:13px;}
}

/* RESPONSIVO TV */
@media(min-width:900px){
  .sidebar{width:130px;}
  .metric-lbl{font-size:9px;letter-spacing:2px;}
  .metric-val{font-size:38px;}
  .metric-val.small{font-size:24px;}
  .meta-pct-lbl{font-size:10px;}
  .live-lbl{font-size:8px;}
  .cs{font-size:9px;}
  .cs-dot,.live-dot{width:8px;height:8px;}
  .logo-img{height:72px;}
  .logo-sub{font-size:11px;}
  .month-badge{font-size:11px;}
  .th-pos,.th-name,.th-sem,.th-tot{font-size:10px;padding:9px 4px;}
  .th-name{padding:9px 12px;}
  .tname{font-size:17px;}
  .tmeta{font-size:9px;}
  .cell-pos{font-size:20px;}
  .r1 .cell-pos{font-size:24px;}
  .cell-sem{font-size:24px;}
  .cell-sem .acum{font-size:9px;}
  .sem-val{font-size:22px;}
  .cell-tot{font-size:30px;}
  .cell-tot .pct{font-size:9px;}
  .tot-sem-val{font-size:22px;}
  .tot-tot-val{font-size:26px;}
  .tot-label{font-size:11px;letter-spacing:4px;padding:10px 14px;}
  .barmini{height:3px;margin-top:4px;}
}

@media(min-width:1440px){
  .sidebar{width:160px;}
  .metric-val{font-size:52px;}
  .metric-val.small{font-size:32px;}
  .tname{font-size:22px;}
  .cell-sem{font-size:30px;}
  .sem-val{font-size:28px;}
  .cell-tot{font-size:38px;}
  .cell-pos{font-size:26px;}
  .r1 .cell-pos{font-size:30px;}
  .logo-img{height:90px;}
}
</style>

<script>
const CFG_CHIS={apiKey:"AIzaSyAStKygESgvDlcqL8AcPd2K6cQLDS4IpuQ",authDomain:"ranking-chis.firebaseapp.com",databaseURL:"https://ranking-chis-default-rtdb.firebaseio.com",projectId:"ranking-chis",appId:"1:817538775589:web:23e5710cad96ef674a1dcc"};

const CFG_LUIZ={apiKey:"AIzaSyDV6UD6NqSkfDhFvtSSWsKWLeSSVy5z5Cg",authDomain:"luiz-6a2ba.firebaseapp.com",databaseURL:"https://luiz-6a2ba-default-rtdb.firebaseio.com",projectId:"luiz-6a2ba",storageBucket:"luiz-6a2ba.firebasestorage.app"};

let selWeek=null; // null = nenhuma semana expandida (mostra só total)
// Edição inline (equipes manuais): {id, field} — field é 'nome', 'meta' ou o
// índice da semana. Enquanto uma célula está sendo editada, render() não
// redesenha a tabela (senão o input perderia o foco a cada atualização ao
// vivo do Chis/Luiz vindo do Firebase) — só quando o campo perde o foco.
let editing=null;
// BUGFIX: vendasDia era sobrescrito só pelo config do Chis — o listener do
// Luiz nunca lia vendas_dia (só meta/cotasFantasma), então a venda do dia do
// Luiz nunca entrava na conta. Agora soma os dois: Chis (1 valor) + Luiz
// (pode ter mais de uma equipe em gr_equipes, soma todas).
let vendasDia=0;
let vendasDiaChis=0;
let vendasDiaLuizPorEquipe={};
function recalcVendasDia(){
  const luizTotal=Object.values(vendasDiaLuizPorEquipe).reduce((a,b)=>a+(b||0),0);
  vendasDia=vendasDiaChis+luizTotal;
}
let dbManual=null, saveTimer=null;
let numSemanas=5; // número de semanas configurável

// ---- FUNÇÕES: EDITAR MÊS ----
function openMonthModal(){
  const current=document.getElementById('monthBadge').textContent;
  document.getElementById('monthInput').value=current==='—'?'':current;
  document.getElementById('monthModal').classList.add('open');
  setTimeout(()=>document.getElementById('monthInput').focus(),50);
}
function closeMonthModal(){
  document.getElementById('monthModal').classList.remove('open');
}
function saveMonthName(){
  const val=document.getElementById('monthInput').value.trim();
  document.getElementById('monthBadge').textContent=val||meses[new Date().getMonth()]+' '+new Date().getFullYear();
  closeMonthModal();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape') closeMonthModal();
  if(e.key==='Enter' && document.getElementById('monthModal').classList.contains('open')) saveMonthName();
});
document.getElementById('monthModal').addEventListener('click',function(e){
  if(e.target===this) closeMonthModal();
});

// ---- FUNÇÕES: NÚMERO DE SEMANAS ----
function changeWeeks(delta){
  numSemanas=Math.max(1,Math.min(8,numSemanas+delta));
  document.getElementById('weekNum').textContent=numSemanas;
  // Ajusta array de semanas de TODAS as equipes manuais (não só Select/Extra)
  teams.filter(t=>t.src==='manual').forEach(t=>{
    while(t.semanas.length<numSemanas) t.semanas.push(0);
    t.semanas=t.semanas.slice(0,numSemanas);
  });
  render();
}

let manualIdCounter=0;
function genManualId(){ return 'm'+Date.now()+'_'+(manualIdCounter++); }

// Abre a edição inline de uma célula (nome, meta ou uma semana) de uma equipe
// manual — usado por clique direto na tabela do Ranking (ver render()).
function startEdit(id,field){
  editing={id,field};
  render(true);
  // Foca e seleciona o conteúdo do input recém-criado, pra já poder digitar.
  requestAnimationFrame(()=>{
    const inp=document.querySelector('#tblBody input');
    if(inp){ inp.focus(); inp.select(); }
  });
}
function finishEditNome(id,val){ editing=null; renameManualTeam(id,val); }
function finishEditMeta(id,val){ editing=null; updateManualTeamMeta(id,val); }
function finishEditWeek(id,idx,val){ editing=null; updateManualTeamWeek(id,idx,val); }

// FEATURE NOVA: adiciona uma equipe manual — antes era impossível, só existiam
// Select e Extra fixas no código. Já abre editando o nome, pra digitar na hora.
function addManualTeam(){
  const qtdAtual=teams.filter(t=>t.src==='manual').length;
  const t={id:genManualId(), nome:'Nova Equipe '+(qtdAtual+1), semanas:Array(numSemanas).fill(0), cotasFantasma:0, meta:40, src:'manual'};
  teams.push(t);
  scheduleManualSave();
  startEdit(t.id,'nome');
}

// FEATURE NOVA: remove uma equipe manual pelo id — pede confirmação porque é destrutivo.
function removeManualTeam(id){
  if(!confirm('Remover esta equipe? Os dados dela serão apagados.'))return;
  if(editing&&editing.id===id) editing=null;
  teams=teams.filter(t=>t.id!==id);
  render(true);
  scheduleManualSave();
}

function renameManualTeam(id,val){
  const t=teams.find(x=>x.id===id);
  if(t){ t.nome=val||t.nome; render(true); scheduleManualSave(); }
}
function updateManualTeamWeek(id,idx,val){
  const t=teams.find(x=>x.id===id);
  if(t){ t.semanas[idx]=parseInt(val)||0; render(true); scheduleManualSave(); }
}
function updateManualTeamMeta(id,val){
  const t=teams.find(x=>x.id===id);
  if(t){ t.meta=parseInt(val)||0; render(true); scheduleManualSave(); }
}
function scheduleManualSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveManualToFirebase,800);
}



let teams=[
  {nome:'Chis',   semanas:[], cotasFantasma:0, meta:100, src:'firebase'},
  {id:'select_default', nome:'Select', semanas:[0,0,0,0,0], cotasFantasma:0, meta:40, src:'manual'},
  {id:'extra_default',  nome:'Extra',  semanas:[0,0,0,0,0], cotasFantasma:0, meta:40, src:'manual'},
  {nome:'Luiz',   semanas:[], cotasFantasma:0, meta:160, src:'firebase_luiz'},
];

const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
document.getElementById('monthBadge').textContent=meses[new Date().getMonth()]+' '+new Date().getFullYear();

function saveManualToFirebase(){
  if(!dbManual) return;
  const manualData={};
  teams.filter(t=>t.src==='manual').forEach(t=>{
    manualData[t.id]={nome:t.nome, semanas:t.semanas, meta:t.meta};
  });
  // BUGFIX: o caminho era 'equipes_manuais_v2' na raiz do banco, fora da árvore
  // 'equipe_danylo' — e só 'equipe_danylo' tem regra de acesso liberada no
  // Firebase. Isso fazia TODO salvamento falhar com "Permission denied",
  // silenciosamente (só ia pro console, sem avisar ninguém) — nada digitado
  // aqui nunca foi salvo de verdade. Corrigido para gravar dentro da árvore
  // que já tem permissão.
  dbManual.ref('equipe_danylo/equipes_manuais_v2').set(manualData).then(()=>{
    const s=document.getElementById('saveStatus');
    if(s){s.textContent='Salvo ✓'; setTimeout(()=>s.textContent='',2000);}
  }).catch(e=>{
    console.error(e);
    const s=document.getElementById('saveStatus');
    if(s){s.style.color='#e08888';s.textContent='Erro ao salvar: '+e.message;}
  });
}

function getTotal(t){return (t.semanas||[]).reduce((a,b)=>a+(b||0),0)+(t.cotasFantasma||0);}

function somarSemanas(dados){
  const tot=[];
  Object.values(dados||{}).forEach(v=>{
    if(!v||v.s==null)return;
    const arr=Array.isArray(v.s)?v.s:Object.values(v.s);
    arr.forEach((val,i)=>{tot[i]=(tot[i]||0)+(Number(val)||0);});
  });
  return tot;
}

function render(force){
  if(editing && !force) return;
  const maxW=Math.max(...teams.map(t=>(t.semanas||[]).length),2);
  const grand=teams.reduce((s,t)=>s+getTotal(t),0);
  const metaTot=teams.reduce((s,t)=>s+(t.meta||0),0);
  const pct=metaTot>0?Math.min(Math.round(grand/metaTot*100),100):0;

  document.getElementById('totCotas').textContent=grand;
  document.getElementById('vendasDia').textContent=vendasDia;
  document.getElementById('metaVal').textContent=metaTot;
  document.getElementById('metaPct').textContent=pct+'%';
  document.getElementById('metaFg').style.width=pct+'%';

  // Grid columns: pos(28px) + name(1fr) + semanas colapsadas/expandidas + total(52px)
  // Semana colapsada = 28px, expandida = 52px
  const semCols = Array.from({length:maxW},(_,i)=>
    selWeek===i ? '52px' : '28px'
  ).join(' ');
  const gridCols = `1fr ${semCols} 52px`;

  // --- HEADER ---
  const head = document.getElementById('tblHead');
  head.style.gridTemplateColumns = gridCols;
  head.innerHTML = '';

  const thName = document.createElement('div'); thName.className='th-name'; thName.textContent='Equipe'; head.appendChild(thName);

  for(let i=0;i<maxW;i++){
    const th = document.createElement('div');
    th.className='th-sem'+(selWeek===i?' active-col':'');
    th.innerHTML = selWeek===i
      ? `<span style="font-size:6px;letter-spacing:1px;">Sem ${i+1}</span>`
      : `<span style="font-size:7px;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px;">${i+1}</span>`;
    th.onclick=()=>{ selWeek=(selWeek===i?null:i); render(); };
    head.appendChild(th);
  }

  const thTot = document.createElement('div'); thTot.className='th-tot'; thTot.textContent='Total'; head.appendChild(thTot);

  // --- BODY ---
  const sorted=[...teams].sort((a,b)=>getTotal(b)-getTotal(a));
  const maxV=Math.max(...sorted.map(t=>getTotal(t)),1);
  const body=document.getElementById('tblBody');

  // FLIP (First-Last-Invert-Play): guarda a posição de cada linha ANTES de
  // redesenhar, pra animar a "ultrapassagem" quando duas equipes trocam de
  // posição no ranking, em vez da linha simplesmente pular de lugar.
  // Identifica a linha pelo nome da equipe (chave estável entre renders).
  const oldRects={};
  body.querySelectorAll('.tbl-row').forEach(row=>{
    const key=row.dataset.teamKey;
    if(key) oldRects[key]=row.getBoundingClientRect();
  });
  body.innerHTML='';

  // Totais por semana
  const semTots=Array.from({length:maxW},(_,i)=>teams.reduce((s,t)=>s+((t.semanas||[])[i]||0),0));

  sorted.forEach((t,i)=>{
    const totReal=getTotal(t);
    const bp=Math.round(totReal/maxV*100);
    const mp=t.meta>0?Math.round(totReal/t.meta*100):null;
    const cls=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const medal=i===0?'①':i===1?'②':i===2?'③':(i+1);

    const row=document.createElement('div');
    row.className='tbl-row '+cls;
    row.style.gridTemplateColumns=gridCols;
    row.dataset.teamKey=t.nome;

    // name — equipes manuais podem ter nome/meta editados no clique, e têm
    // botão de remover que só aparece ao passar o mouse.
    const isManual=t.src==='manual';
    const editingThis=editing&&editing.id===t.id;
    const cName=document.createElement('div'); cName.className='cell-name';
    if(isManual && editingThis && editing.field==='nome'){
      cName.innerHTML=`<input class="m-input" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:3px 6px" value="${(t.nome||'').replace(/"/g,'&quot;')}" onblur="finishEditNome('${t.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
        <div class="tmeta">meta ${t.meta}</div>
        <div class="barmini"><div class="barfill" style="width:${bp}%"></div></div>`;
    } else if(isManual && editingThis && editing.field==='meta'){
      cName.innerHTML=`<div class="tname">${t.nome}</div>
        <div class="tmeta" style="display:flex;align-items:center;gap:4px">meta <input class="m-input" type="number" min="0" style="width:60px;padding:1px 4px;font-size:10px" value="${t.meta||0}" onblur="finishEditMeta('${t.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"></div>
        <div class="barmini"><div class="barfill" style="width:${bp}%"></div></div>`;
    } else {
      cName.innerHTML=`<div class="tname"${isManual?` onclick="startEdit('${t.id}','nome')" style="cursor:pointer"`:''}>${t.nome}</div>
        <div class="tmeta"${isManual?` onclick="startEdit('${t.id}','meta')" style="cursor:pointer"`:''}>meta ${t.meta}</div>
        <div class="barmini"><div class="barfill" style="width:${bp}%"></div></div>
        ${isManual?`<button class="row-del-btn" onclick="event.stopPropagation();removeManualTeam('${t.id}')" title="Remover equipe">🗑️</button>`:''}`;
    }
    row.appendChild(cName);
    // semanas — nas equipes manuais, clicar numa célula edita o valor dela;
    // nas demais (Chis/Luiz, vêm ao vivo do Firebase), clicar continua só
    // expandindo/recolhendo a coluna daquela semana, como sempre foi.
    for(let s=0;s<maxW;s++){
      const val=(t.semanas||[])[s]||0;
      const acum=(t.semanas||[]).slice(0,s+1).reduce((a,b)=>a+(b||0),0);
      const cSem=document.createElement('div');
      cSem.className='cell-sem'+(selWeek===s?' active-col':'')+(isManual?' editable':'');
      if(isManual && editingThis && editing.field===s){
        cSem.innerHTML=`<input class="m-input" type="number" min="0" style="width:100%;height:60%;text-align:center;padding:0;font-size:14px" value="${val}" onblur="finishEditWeek('${t.id}',${s},this.value)" onkeydown="if(event.key==='Enter')this.blur()">`;
      } else if(isManual){
        cSem.onclick=()=>startEdit(t.id,s);
        cSem.innerHTML=selWeek===s
          ? `${val}<span class="acum">↑${acum}</span>`
          : `<span class="sem-val" style="font-weight:700;">${val}</span>`;
      } else {
        cSem.onclick=()=>{ selWeek=(selWeek===s?null:s); render(); };
        if(selWeek===s){
          cSem.innerHTML=`${val}<span class="acum">↑${acum}</span>`;
        } else {
          cSem.innerHTML=`<span class="sem-val" style="font-weight:700;">${val}</span>`;
        }
      }
      row.appendChild(cSem);
    }
    // total
    const cTot=document.createElement('div'); cTot.className='cell-tot';
    cTot.innerHTML=`${totReal}${mp!==null?`<span class="pct">${mp}%</span>`:''}`;
    row.appendChild(cTot);

    body.appendChild(row);
  });

  // FLIP — passo "Play": compara a posição antiga (capturada acima) com a
  // nova e anima a diferença. Sem isso a linha só "pula" pro novo lugar.
  // Respeita prefers-reduced-motion (usuário que pediu menos movimento).
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion){
    requestAnimationFrame(()=>{
      body.querySelectorAll('.tbl-row').forEach(row=>{
        const key=row.dataset.teamKey;
        const oldRect=oldRects[key];
        if(!oldRect) return; // equipe nova, sem posição anterior — não anima
        const newRect=row.getBoundingClientRect();
        const deltaY=oldRect.top-newRect.top;
        if(Math.abs(deltaY)<1) return; // não mudou de posição, não precisa animar
        row.style.transition='none';
        row.style.transform=`translateY(${deltaY}px)`;
        row.style.zIndex='5';
        row.style.position='relative';
        requestAnimationFrame(()=>{
          row.style.transition='transform 480ms cubic-bezier(.2,.8,.2,1)';
          row.style.transform='translateY(0)';
          row.addEventListener('transitionend',()=>{
            row.style.transition='';row.style.transform='';row.style.zIndex='';row.style.position='';
          },{once:true});
        });
      });
    });
  }

  // --- TOTAL ROW ---
  const totRow=document.getElementById('tblTotal');
  totRow.style.gridTemplateColumns=gridCols;
  totRow.innerHTML='';
  const tl=document.createElement('div'); tl.className='tot-label'; tl.textContent='TOTAL'; totRow.appendChild(tl);
  for(let s=0;s<maxW;s++){
    const tv=document.createElement('div'); tv.className='tot-sem-val';
    tv.style.borderLeft=(selWeek===s)?'1px solid var(--gold)':'1px solid var(--bd)';
    if(selWeek===s) tv.style.background='rgba(201,168,76,0.28)';
    tv.textContent=selWeek===s ? semTots[s] : '';
    totRow.appendChild(tv);
  }
  const tt=document.createElement('div'); tt.className='tot-tot-val'; tt.textContent=grand; totRow.appendChild(tt);
}

window.addEventListener('load',function(){
  try{
    const appD=firebase.initializeApp(CFG_DANYLO,'danylo');
    const dbD=firebase.database(appD);

    dbD.ref('equipe_danylo/config').on('value',s=>{
      const c=s.val()||{};
      const t=teams.find(x=>x.nome==='Chis');
      if(c.meta) t.meta=c.meta;
      if(c.cotasFantasma!=null) t.cotasFantasma=Number(c.cotasFantasma)||0;
      if(c.vendas_dia!=null) vendasDiaChis=c.vendas_dia;
      recalcVendasDia();
      render();
    });
    dbD.ref('equipe_danylo/dados').on('value',s=>{
      const t=teams.find(x=>x.nome==='Chis');
      const dados=s.val()||{};
      const vends={};
      Object.entries(dados).forEach(([k,v])=>{if(v&&v.s!=null)vends[k]=v;});
      t.semanas=somarSemanas(vends);
      document.getElementById('dotChis').className='cs-dot ok';
      render();
    },e=>{document.getElementById('dotChis').className='cs-dot err';});

    dbManual=dbD;
    // BUGFIX: caminho corrigido para dentro de 'equipe_danylo' (ver saveManualToFirebase).
    // A migração do formato antigo ('equipes_manuais', só select/extra) foi removida —
    // verificado direto no banco que nunca existiu dado nenhum lá (o salvamento sempre
    // falhou por permissão, então não tinha o que migrar).
    dbD.ref('equipe_danylo/equipes_manuais_v2').on('value',s=>{
      const d=s.val();
      if(d && Object.keys(d).length){
        teams=teams.filter(t=>t.src!=='manual');
        Object.entries(d).forEach(([id,v])=>{
          teams.push({id, nome:v.nome||'Equipe', semanas:v.semanas||[], cotasFantasma:0, meta:v.meta||40, src:'manual'});
        });
        const maxLen=Math.max(2,...teams.filter(t=>t.src==='manual').map(t=>(t.semanas||[]).length));
        if(maxLen!==numSemanas){
          numSemanas=maxLen;
          document.getElementById('weekNum').textContent=numSemanas;
        }
      }
      render();
    },e=>{console.error('[Manual]',e.message);});

  }catch(e){console.error('ERRO:',e.message);}

  // ═══ LUIZ: lê todas as equipes em tempo real ═══
  try{
    const appL=firebase.initializeApp(CFG_LUIZ,'luiz');
    const dbL=firebase.database(appL);
    const tL=teams.find(x=>x.nome==='Luiz');

    // 1. Lê a lista de equipes (gr_equipes) — quando mudar, reassina os dados de cada uma
    dbL.ref('gr_equipes').on('value',snapEquipes=>{
      const listaEquipes=snapEquipes.val()||{};
      // Para cada equipe registrada, escuta os dados e config em tempo real
      Object.keys(listaEquipes).forEach(eqKey=>{
        // Config: meta, cotasFantasma e vendas_dia (soma todas as equipes do Luiz)
        dbL.ref(`${eqKey}/config`).on('value',snapCfg=>{
          const c=snapCfg.val()||{};
          if(c.meta) tL.meta=Number(c.meta);
          if(c.cotasFantasma!=null) tL.cotasFantasma=Number(c.cotasFantasma)||0;
          if(c.vendas_dia!=null) vendasDiaLuizPorEquipe[eqKey]=Number(c.vendas_dia)||0;
          recalcVendasDia();
          render();
        });
        // Dados: vendedores com semanas
        dbL.ref(`${eqKey}/dados`).on('value',snapDados=>{
          // Reasume todas as equipes do Luiz zeradas e resoma
          const dadosEquipe=snapDados.val()||{};
          const vends={};
          Object.entries(dadosEquipe).forEach(([k,v])=>{
            if(v&&v.s!=null) vends[`${eqKey}_${k}`]=v;
          });
          // Guarda por equipe para somar corretamente depois
          if(!tL._eqDados) tL._eqDados={};
          tL._eqDados[eqKey]=vends;
          // Soma todas as equipes
          const todosVends=Object.assign({},...Object.values(tL._eqDados));
          tL.semanas=somarSemanas(todosVends);
          document.getElementById('dotLuiz').className='cs-dot ok';
          render();
        },()=>{document.getElementById('dotLuiz').className='cs-dot err';});
      });
    },()=>{document.getElementById('dotLuiz').className='cs-dot err';});
  }catch(e){console.error('ERRO Luiz:',e.message);}
});
render();
</script>
